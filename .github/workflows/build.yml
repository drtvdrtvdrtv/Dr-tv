name: Build DR TV for Fire Stick

on:
  workflow_dispatch:
  push:
    paths:
      - DR-TV-IPTV-Android-FireStick-Source.zip
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack DR TV project
        run: unzip -q DR-TV-IPTV-Android-FireStick-Source.zip

      - name: Compile APK
        working-directory: DRTV-AndroidTV
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp DRTV-AndroidTV/app/build/outputs/apk/debug/app-debug.apk DR-TV-FireStick.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DR-TV-FireStick-APK
          path: DR-TV-FireStick.apk
          if-no-files-found: error
          retention-days: 30
